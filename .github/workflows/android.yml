name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set test signing path
        run: echo "VERSANDHILFE_DEBUG_KEYSTORE=$RUNNER_TEMP/versandhilfe-debug.keystore" >> "$GITHUB_ENV"
      - name: Restore consistent test signing key
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/versandhilfe-debug.keystore
          key: versandhilfe-debug-signing-v2
      - name: Ensure test signing key exists
        run: |
          if [ ! -f "$VERSANDHILFE_DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$VERSANDHILFE_DEBUG_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Tests, lint and installable APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Versandhilfe-2.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Versandhilfe-Android-APK
          path: Versandhilfe-2.0.0.apk
          if-no-files-found: error
          retention-days: 30
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-und-Lint-Berichte
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-Geraetetests
          path: |
            app/build/reports/androidTests/
            app/build/outputs/connected_android_test_additional_output/
