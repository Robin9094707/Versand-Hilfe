name: Vinted QR on Android 13
on:
  push:
    branches: [verify/vinted-android13]
permissions:
  contents: read
jobs:
  vinted-android13:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew :screenfixture:assembleDebug
            adb install screenfixture/build/outputs/apk/debug/screenfixture-debug.apk
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=de.rj.versandhilfe.VintedAssistTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vinted-Android13-Pruefung
          path: |
            app/build/reports/androidTests/
            app/build/outputs/connected_android_test_additional_output/
